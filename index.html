<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DOL Pool — Türkiye</title>
<style>
  :root {
    --navy: #1E2761;
    --teal: #0E5C53;
    --ice: #EDF2FA;
    --border: #E0E4EE;
    --text: #1A231F;
    --muted: #6B7A72;
    --card-bg: #FFFFFF;
    --page-bg: #F7F8F4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text);
  }
  header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: white;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    color: var(--navy);
  }
  header .sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .controls {
    padding: 16px 20px;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .control-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .control-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-right: 4px;
    flex-shrink: 0;
  }

  .pill-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    flex-wrap: nowrap;
  }
  .pill-scroll::-webkit-scrollbar { height: 4px; }
  .pill-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  button.pill {
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.12s ease;
  }
  button.pill:hover { border-color: var(--teal); }
  button.pill.active {
    background: var(--teal);
    border-color: var(--teal);
    color: white;
  }
  button.pill.platform-off {
    opacity: 0.4;
  }

  select#sortSelect {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    background: white;
    color: var(--text);
  }

  input#searchBox {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    width: 100%;
    max-width: 280px;
  }

  .summary {
    padding: 12px 20px 0;
    font-size: 13px;
    color: var(--muted);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    padding: 16px 20px 40px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--navy);
    text-decoration: none;
  }
  .card-name:hover { text-decoration: underline; }
  .card-username {
    font-size: 12px;
    color: var(--muted);
  }
  .platform-badge {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 5px;
    flex-shrink: 0;
  }
  .platform-instagram { background: #FCE7F3; color: #9D174D; }
  .platform-tiktok { background: #E0E7FF; color: #3730A3; }
  .platform-youtube { background: #FEE2E2; color: #991B1B; }

  .card-meta {
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
  }
  .card-meta strong { color: var(--text); }

  .confidence-tag {
    display: inline-block;
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  .conf-high { background: #E3EFE9; color: #1F5F45; }
  .conf-medium { background: #F3EBDB; color: #8A6420; }
  .conf-low { background: #F1EEE9; color: #7A756A; }
  .conf-verified_external { background: #E4EAF2; color: #2C4B75; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; padding: 12px; }
    header, .controls { padding-left: 12px; padding-right: 12px; }
    .control-label { width: 100%; margin-bottom: 2px; }
  }
</style>
</head>
<body>

<header>
  <h1>DOL Pool — Türkiye</h1>
  <div class="sub" id="headerSub">Loading...</div>
</header>

<div class="controls">
  <div class="control-row">
    <span class="control-label">Platform</span>
    <button class="pill active" data-platform="instagram" onclick="togglePlatform('instagram')">Instagram</button>
    <button class="pill active" data-platform="youtube" onclick="togglePlatform('youtube')">YouTube</button>
    <button class="pill active" data-platform="tiktok" onclick="togglePlatform('tiktok')">TikTok</button>
  </div>

  <div class="control-row">
    <span class="control-label">Specialty</span>
    <div class="pill-scroll" id="specialtyPills"></div>
  </div>

  <div class="control-row">
    <span class="control-label">City</span>
    <div class="pill-scroll" id="cityPills"></div>
  </div>

  <div class="control-row">
    <span class="control-label">Sort</span>
    <select id="sortSelect" onchange="render()">
      <option value="followers_desc">Followers: High to Low</option>
      <option value="followers_asc">Followers: Low to High</option>
      <option value="engagement_desc">Engagement: High to Low</option>
      <option value="views_desc">Avg Views: High to Low</option>
      <option value="name_asc">Name: A to Z</option>
    </select>
    <input id="searchBox" type="text" placeholder="Search name, city..." oninput="render()" />
  </div>
</div>

<div class="summary" id="summary"></div>
<div class="grid" id="grid"></div>

<script>
let allRows = [];
let activePlatforms = new Set(["instagram", "youtube", "tiktok"]);
let activeSpecialties = new Set();
let activeCities = new Set();

function togglePlatform(p) {
  if (activePlatforms.has(p)) activePlatforms.delete(p); else activePlatforms.add(p);
  document.querySelector(`button[data-platform="${p}"]`).classList.toggle("platform-off", !activePlatforms.has(p));
  render();
}

function togglePill(set, value, btn) {
  if (set.has(value)) { set.delete(value); btn.classList.remove("active"); }
  else { set.add(value); btn.classList.add("active"); }
  render();
}

function buildPillGroup(containerId, values, activeSet) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  values.forEach((v) => {
    const btn = document.createElement("button");
    btn.className = "pill";
    btn.textContent = v;
    btn.onclick = () => togglePill(activeSet, v, btn);
    container.appendChild(btn);
  });
}

function fmtNum(n) {
  n = Number(n) || 0;
  return n.toLocaleString();
}

function render() {
  const search = document.getElementById("searchBox").value.toLowerCase();
  const sortMode = document.getElementById("sortSelect").value;

  let filtered = allRows.filter((r) => {
    if (!activePlatforms.has((r.platform || "").toLowerCase())) return false;
    if (activeSpecialties.size && !activeSpecialties.has(r.specialty)) return false;
    if (activeCities.size && !activeCities.has(r.city)) return false;
    if (search) {
      const hay = `${r.username} ${r.full_name} ${r.city}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    switch (sortMode) {
      case "followers_asc": return (a.followers || 0) - (b.followers || 0);
      case "engagement_desc": return (b.engagement_rate_pct || 0) - (a.engagement_rate_pct || 0);
      case "views_desc": return (b.avg_views_last9 || 0) - (a.avg_views_last9 || 0);
      case "name_asc": return (a.full_name || a.username || "").localeCompare(b.full_name || b.username || "");
      default: return (b.followers || 0) - (a.followers || 0); // followers_desc
    }
  });

  document.getElementById("summary").textContent = `${filtered.length} of ${allRows.length} accounts shown`;

  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">No accounts match these filters.</div>`;
    return;
  }

  grid.innerHTML = filtered.map((r) => {
    const platform = (r.platform || "").toLowerCase();
    const confClass = "conf-" + (r.confidence || "low");
    const confLabel = r.confidence === "verified_external" ? "verified" : (r.confidence || "unknown");
    return `
      <div class="card">
        <div class="card-top">
          <div>
            <a class="card-name" href="${r.profile_url || '#'}" target="_blank" rel="noreferrer">${r.full_name || r.username}</a>
            <div class="card-username">@${r.username}</div>
          </div>
          <span class="platform-badge platform-${platform}">${platform}</span>
        </div>
        <div class="card-meta">
          <span><strong>${fmtNum(r.followers)}</strong> followers</span>
          ${r.avg_views_last9 ? `<span><strong>${fmtNum(r.avg_views_last9)}</strong> avg views</span>` : ""}
          ${r.engagement_rate_pct ? `<span><strong>${r.engagement_rate_pct}%</strong> engagement</span>` : ""}
        </div>
        <div class="card-meta">
          ${r.specialty ? `<span>${r.specialty}</span>` : ""}
          ${r.city ? `<span>${r.city}</span>` : ""}
        </div>
        <span class="confidence-tag ${confClass}">${confLabel}</span>
      </div>
    `;
  }).join("");
}

fetch("./data.json?t=" + Date.now())
  .then((r) => { if (!r.ok) throw new Error("data.json not found (" + r.status + ")"); return r.json(); })
  .then((json) => {
    allRows = json.rows || [];
    const meta = json.meta || {};
    document.getElementById("headerSub").textContent =
      `${allRows.length} accounts` + (meta.updatedAt ? ` · updated ${new Date(meta.updatedAt).toLocaleDateString()}` : "");

    const specialties = [...new Set(allRows.map((r) => r.specialty).filter(Boolean))].sort();
    const cities = [...new Set(allRows.map((r) => r.city).filter(Boolean))].sort();
    buildPillGroup("specialtyPills", specialties, activeSpecialties);
    buildPillGroup("cityPills", cities, activeCities);

    render();
  })
  .catch((e) => {
    document.getElementById("headerSub").textContent = "Couldn't load data.json";
    document.getElementById("grid").innerHTML = `<div class="empty">${e.message}<br>Make sure data.json is in the same folder as this index.html.</div>`;
  });
</script>

</body>
</html>
